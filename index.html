<meta charset="UTF-8">

<title>echo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0b0b0f;
    color: #e6e6ea;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ---------- LOADING SCREEN ---------- */
  #loader {
    position: fixed;
    inset: 0;
    background: #0b0b0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 999;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  #loader.hidden { opacity: 0; visibility: hidden; }

  .ring {
    width: 70px; height: 70px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #7c5cff;
    border-right-color: #4dd6ff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    letter-spacing: 6px;
    font-size: 14px;
    text-transform: uppercase;
    color: #8a8a99;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

  /* ---------- MAIN CONTENT ---------- */
  main {
    text-align: center;
    padding: 40px 20px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1s ease, transform 1s ease;
  }
  main.show { opacity: 1; transform: translateY(0); }

  .avatar {
    width: 120px; height: 120px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c5cff, #4dd6ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: bold;
    color: #fff;
    box-shadow: 0 0 40px rgba(124, 92, 255, 0.5);
  }

  h1 { font-size: 2.4rem; margin-bottom: 8px; }
  .handle { color: #8a8a99; margin-bottom: 32px; }

  /* ---------- SOCIAL LINKS ---------- */
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
  }
  .links a {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #16161d;
    border: 1px solid #2a2a35;
    padding: 14px 22px;
    border-radius: 12px;
    color: #e6e6ea;
    text-decoration: none;
    transition: transform 0.2s, border-color 0.2s, background 0.2s;
  }
  .links a:hover {
    transform: translateY(-3px);
    border-color: #7c5cff;
    background: #1d1d27;
  }
  .links svg { width: 22px; height: 22px; fill: currentColor; }
  .links .email { color: #4dd6ff; }
</style>
