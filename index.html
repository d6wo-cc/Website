<style>
:root{
  --bg:#292d33; --panel:#343a42; --line:#4a535e; --text:#f1f3f6; --mute:#b1bac4;
  --accent:#80b8ec; --ice:#80b8ec;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Hanken Grotesk',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(135deg,#252a30 0%,#30363e 54%,#282d33 100%) fixed;color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 50% at 80% 0%,rgba(150,160,170,.12),transparent 70%),radial-gradient(50% 40% at 0% 100%,rgba(110,119,129,.12),transparent 70%)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px;border-radius:8px}
#root{position:relative;min-height:100%;display:flex;flex-direction:column}

header{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,5vw,56px);position:sticky;top:0;z-index:20;
  background:linear-gradient(rgba(41,45,51,.94) 40%,transparent)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
nav{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(52,58,66,.84);backdrop-filter:blur(10px)}
nav button{position:relative;background:none;border:0;color:var(--mute);font:500 14px var(--body);padding:8px 16px;border-radius:999px;cursor:pointer;transition:color .2s}
nav button:hover{color:var(--text)}
nav button[aria-selected=true]{color:var(--ice);background:#434b55}
nav .pill{position:absolute;top:4px;bottom:4px;left:0;background:#434b55;border-radius:999px;z-index:0}
nav button span{position:relative;z-index:1}
.tab-nav{display:grid;gap:7px;width:max-content}
.tab-progress{position:relative;height:3px;margin:0 8px;border-radius:3px;background:var(--line);overflow:hidden}
.tab-progress-marker{position:absolute;inset:0 auto 0 0;background:var(--ice);border-radius:inherit;transition:left .35s cubic-bezier(.22,1,.36,1)}

main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:clamp(24px,6vh,72px) clamp(20px,5vw,56px) 64px}

/* Home */
.hero{display:grid;gap:40px;grid-template-columns:1fr;align-items:center}
@media(min-width:820px){.hero{grid-template-columns:1.25fr 1fr;gap:64px}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(72px,15vw,180px);line-height:.88;letter-spacing:-.045em;display:flex;overflow:hidden;padding-bottom:.08em}
.lede{color:var(--mute);font-size:18px;line-height:1.6;max-width:44ch;margin:24px 0 32px}
.contacts{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:14px;font-weight:500;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--ice);background:#3e4751}
.chip svg{width:18px;height:18px;fill:currentColor;color:var(--accent)}

.presence{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
.who{display:flex;align-items:center;gap:18px}
.av-wrap{position:relative;width:76px;height:76px;flex:none}
.av{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--ice));display:grid;place-items:center;font:800 30px var(--display);color:#202b38;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;right:0;bottom:2px;width:20px;height:20px;border-radius:50%;border:4px solid var(--panel);background:#747f8d}
.dot.online{background:#43b581}.dot.idle{background:#faa61a}.dot.dnd{background:#f04747}
.who b{display:block;font:700 20px var(--display)}
.who small{color:var(--mute);font-size:14px}
.act{display:block;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.act small{display:block;color:var(--mute);font-size:13px;margin-bottom:6px}
.act strong{font-size:16px;font-weight:600}
.act p{color:var(--mute);font-size:14px;margin-top:2px}
.quiet{display:block;margin-top:22px;padding-top:20px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}

/* About */
.page-title{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,72px);letter-spacing:-.035em;line-height:1}
.about-copy{color:var(--mute);font-size:19px;line-height:1.65;max-width:52ch;margin:18px 0 44px}
.about-copy b{color:var(--text);font-weight:600}
h2{font:700 20px var(--display);margin-bottom:16px}
.games{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.game{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.game img{width:100%;aspect-ratio:460/215;object-fit:cover;display:block}
.game img.logo{object-fit:contain;padding:18px;background:#252b32}
.game span{display:block;padding:12px 14px;font-weight:600;font-size:15px}
.deal{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:32px;padding:20px 24px;border-radius:16px;background:var(--accent);color:#202b38;font-weight:700;font-size:16px;transition:filter .2s}
.deal:hover{filter:brightness(1.06)}
.deal small{display:block;font-weight:500;opacity:.75;margin-top:2px;font-size:13px}

/* Projects */
.repos{display:grid;gap:14px;margin-top:36px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.repo{display:flex;flex-direction:column;gap:8px;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel);cursor:pointer;transition:border-color .2s}
.repo:hover{border-color:var(--ice)}
.repo h3{font:700 18px var(--display);word-break:break-word}
.repo p{color:var(--mute);font-size:14px;line-height:1.55;flex:1}
.meta{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:6px}
.lang::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.msg{color:var(--mute);margin-top:36px}

/* Contact */
.sub{color:var(--mute);font-size:18px;line-height:1.6;max-width:46ch;margin-top:14px}
.contact-grid{display:grid;gap:14px;margin-top:36px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.c-card{display:flex;flex-direction:column;gap:14px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--panel);transition:border-color .2s}
.c-card:hover{border-color:var(--ice)}
.c-details{display:block;color:inherit}
.c-details:hover h3{color:var(--accent)}
.c-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:#3e4751}
.c-ico svg{width:22px;height:22px;fill:var(--accent)}
.c-card h3{font:700 19px var(--display)}
.c-card p{color:var(--mute);font-size:14px;word-break:break-all}
.c-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;font-size:14px;font-weight:600;color:var(--accent)}
.c-cta{display:inline-flex;align-items:center;gap:4px;color:var(--accent)}
.c-cta:hover{text-decoration:underline;text-underline-offset:4px}
.copy{background:#3e4751;border:1px solid var(--line);color:var(--text);font:600 12px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer;min-width:64px}
.copy:hover{border-color:var(--ice)}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
main{position:relative;z-index:1;overflow-x:clip}
.dot.online{animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(67,181,129,.55)}70%,100%{box-shadow:0 0 0 12px rgba(67,181,129,0)}}
.lede{display:flex;gap:.35em}

.toast{position:fixed;left:50%;bottom:28px;z-index:60;padding:12px 20px;border-radius:999px;background:var(--panel);color:var(--text);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(5,7,11,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;z-index:50}
.modal{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
.modal h3{font:700 20px var(--display);margin-bottom:8px}
.modal p{color:var(--mute);font-size:14px;margin-bottom:6px}
.modal code{display:block;color:var(--accent);font-size:13px;word-break:break-all;margin-bottom:24px}
.actions{display:flex;gap:10px}
.actions button{flex:1;padding:12px;border-radius:12px;font:600 14px var(--body);cursor:pointer;border:1px solid var(--line);background:none;color:var(--text)}
.actions .go{background:var(--accent);border-color:var(--accent);color:#202b38}

/* Loader */
.loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99}
.bar{width:140px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

@media(max-width:480px){.brand{display:none}header{justify-content:center}nav button{padding:8px 11px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const copyText = text => {
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = 0; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); };
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).catch(fallback);
  fallback(); return Promise.resolve();
};

const TabBar = ({ tab, setTab }) => {
  const refs = React.useRef({});
  const [box, setBox] = useState(null);
  React.useLayoutEffect(() => {
    const measure = () => { const el = refs.current[tab]; if (el) setBox({ x: el.offsetLeft, w: el.offsetWidth }); };
    measure();
    window.addEventListener('resize', measure);
    document.fonts?.ready.then(measure);
    return () => window.removeEventListener('resize', measure);
  }, [tab]);
  const tabIndex = TABS.findIndex(([id]) => id === tab);
  return html`
    <div className="tab-nav">
      <nav role="tablist" style=${{ position: 'relative' }}>
        ${box && html`<motion.div className="pill" initial=${false} animate=${{ x: box.x, width: box.w }} transition=${{ type: 'spring', stiffness: 380, damping: 30 }} />`}
        ${TABS.map(([id, label]) => html`
          <button key=${id} ref=${el => { refs.current[id] = el; }} role="tab" aria-selected=${tab === id} onClick=${() => setTab(id)}>
            <span>${label}</span>
          </button>`)}
      </nav>
      <div className="tab-progress" role="progressbar" aria-label="Section position" aria-valuemin="1" aria-valuemax=${TABS.length} aria-valuenow=${tabIndex + 1}>
        <div className="tab-progress-marker" style=${{ left: `${tabIndex * 100 / TABS.length}%`, width: `${100 / TABS.length}%` }} />
      </div>
    </div>`;
};

const Loader = () => html`
  <motion.div className="loader" exit=${{ opacity: 0 }} transition=${{ duration: .6, ease }}>
    <div className="bar"><motion.i initial=${{ width: 0 }} animate=${{ width: '100%' }} transition=${{ duration: 1.2, ease }} /></div>
  </motion.div>`;

const Name = ({ text }) => html`
  <h1 aria-label=${text}>
    ${[...text].map((c, i) => html`
      <motion.span key=${i} aria-hidden="true" style=${{ display: 'inline-block' }}

const Presence = ({ data }) => {
  const u = data?.discord_user;
  const status = data?.discord_status || 'offline';
  const acts = data?.activities || [];
  const act = [0, 2, 3, 4].map(t => acts.find(a => a.type === t)).find(Boolean) || acts[0];

  return html`
    <div className="presence">
      <div className="who">
        <motion.div className="av-wrap" animate=${{ y: [0, -5, 0] }} transition=${{ duration: 4, repeat: Infinity, ease: 'easeInOut' }}>

          <div className=${'dot ' + status}></div>
        </motion.div>
        <div><b>${u?.username || 'echo'}</b><small>${STATUS[status]}</small></div>

      <//>
    </div>`;
};

      <span aria-hidden="true">↗</span>

const Projects = ({ repos, onOpen }) => html`
  <div>
    <h2 className="page-title">Projects</h2>
    ${!repos ? html`<p className="msg">Loading repositories…</p>`
      : !repos.length ? html`<p className="msg">No public repositories yet.</p>`
      : html`<div className="repos">
        ${repos.map((r, i) => html`
          <motion.a key=${r.html_url} className="repo" href=${r.html_url}
            onClick=${e => { e.preventDefault(); onOpen(r.html_url); }}
            initial=${{ opacity: 0, y: 16 }} animate=${{ opacity: 1, y: 0 }}
            transition=${{ delay: .08 + i * .06, duration: .5, ease }} whileHover=${{ y: -4 }}>
            <h3>${r.name}</h3>
            <p>${r.description || 'No description provided.'}</p>
            <div className="meta">
              ${r.language && html`<span className="lang">${r.language}</span>`}
              <span>★ ${r.stargazers_count || 0}</span>
            </div>
          </motion.a>`)}
      </div>`}
  </div>`;

const CopyBtn = ({ onCopy }) => html`
  <motion.button className="copy" onClick=${e => { e.preventDefault(); e.stopPropagation(); onCopy(); }} whileTap=${{ scale: .92 }}>Copy</motion.button>`;

const Contact = ({ username, copy }) => {
  const items = [
    { title:'Email', value:'echo@d6wo.cc', href:'mailto:echo@d6wo.cc', cta:'Send an email', icon:Icon.mail, text:'echo@d6wo.cc', label:'Email', same:true },
    { title:'Discord', value: username ? '@' + username : 'Message me directly', href:'https://discord.com/users/788893081000345602', cta:'Open profile', icon:Icon.discord, text: username || '788893081000345602', label:'Discord username' },
    { title:'Instagram', value:'@opticwtw', href:'https://instagram.com/opticwtw', cta:'View profile', icon:Icon.insta },
    { title:'GitHub', value:'@PawndersPalace', href:'https://github.com/PawndersPalace', cta:'See my code', icon:Icon.github }
  ];
  return html`
    <div>
      <h2 className="page-title">Contact</h2>
      <p className="sub">Reach out by email or find me on any of these. Email and Discord also copy to your clipboard when clicked.</p>
      <div className="contact-grid">
        ${items.map((c, i) => html`
          <motion.div key=${c.title} className="c-card"
            initial="rest" animate="shown" whileHover="hover" whileTap=${{ scale: .98 }}
            variants=${{ rest: { opacity: 0, y: 24 }, shown: { opacity: 1, y: 0, transition: { delay: .1 + i * .09, duration: .55, ease } }, hover: { y: -6, transition: { duration: .2 } } }}>
            <motion.div className="c-ico" variants=${{ hover: { rotate: -8, scale: 1.1 } }}>${c.icon}</motion.div>
            <a className="c-details" href=${c.href} target=${c.same ? undefined : '_blank'} rel="noopener noreferrer"
              onClick=${() => c.text && copy(c.text, c.label)}>
              <h3>${c.title}</h3><p>${c.value}</p>
            </a>
            <div className="c-foot">
              <a className="c-cta" href=${c.href} target=${c.same ? undefined : '_blank'} rel="noopener noreferrer"
                onClick=${() => c.text && copy(c.text, c.label)}>
                ${c.cta} <motion.span style=${{ display: 'inline-block' }} variants=${{ hover: { x: 5, y: -3 } }}>↗</motion.span>
              </a>
              ${c.text && html`<${CopyBtn} onCopy=${() => copy(c.text, c.label)} />`}
            </div>
          </motion.div>`)}
      </div>
    </div>`;
};

const Orbs = () => {
  if (useReducedMotion()) return null;
  return html`
    <${React.Fragment}>
      <motion.div className="orb" style=${{ width: 440, height: 440, background: 'rgba(123,135,148,.10)', top: '-8%', right: '-6%' }}
        animate=${{ x: [0, -70, 30, 0], y: [0, 60, -20, 0] }} transition=${{ duration: 24, repeat: Infinity, ease: 'easeInOut' }} />
      <motion.div className="orb" style=${{ width: 380, height: 380, background: 'rgba(177,183,190,.12)', bottom: '-10%', left: '-6%' }}
        animate=${{ x: [0, 60, -30, 0], y: [0, -50, 20, 0] }} transition=${{ duration: 28, repeat: Infinity, ease: 'easeInOut' }} />
    <//>`;
};

const Confirm = ({ url, onClose }) => html`
  <motion.div className="scrim" onClick=${e => e.target === e.currentTarget && onClose()}
    initial=${{ opacity: 0 }} animate=${{ opacity: 1 }} exit=${{ opacity: 0 }}>
    <motion.div className="modal" role="dialog" aria-modal="true"
      initial=${{ opacity: 0, scale: .95, y: 10 }} animate=${{ opacity: 1, scale: 1, y: 0 }} exit=${{ opacity: 0, scale: .95 }}
      transition=${{ duration: .25, ease }}>
      <h3>Leaving this site</h3>
      <p>You're about to open an external link:</p>
      <code>${url}</code>
      <div className="actions">
        <button onClick=${onClose}>Cancel</button>
        <button className="go" autoFocus onClick=${() => { window.open(url, '_blank', 'noopener,noreferrer'); onClose(); }}>Open link</button>
      </div>
    </motion.div>
  </motion.div>`;

function App() {
  const [tab, setTabRaw] = useState('home');
  const [dir, setDir] = useState(1);
  const setTab = id => {
    if (id === tab) return;
    setDir(TABS.findIndex(t => t[0] === id) > TABS.findIndex(t => t[0] === tab) ? 1 : -1);
    setTabRaw(id);
  };
  const [data, setData] = useState(null);
  const [repos, setRepos] = useState(null);
  const [loading, setLoading] = useState(true);
  const [pending, setPending] = useState(null);
  const [toast, setToast] = useState(null);
  const copy = (text, label) => copyText(text).then(() => {
    setToast(label + ' copied');
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(() => setToast(null), 2000);
  });

  useEffect(() => {
    const pull = () => fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
      .then(r => r.json()).then(j => setData(j.success ? j.data : null)).catch(() => setData(null));
    pull();
    const id = setInterval(pull, 30000);
    fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=updated`)
      .then(r => { if (!r.ok) throw 0; return r.json(); }).then(setRepos).catch(() => setRepos(FALLBACK));
    const t = setTimeout(() => setLoading(false), 1300);
    const esc = e => e.key === 'Escape' && setPending(null);
    window.addEventListener('keydown', esc);
    return () => { clearInterval(id); clearTimeout(t); window.removeEventListener('keydown', esc); };
  }, []);

  return html`
    <${React.Fragment}>
      <${Orbs} />
      <${AnimatePresence}>${loading && html`<${Loader} key="l" />`}<//>
      <header>
        <span className="brand">GE</span>
        <${TabBar} tab=${tab} setTab=${setTab} />
      </header>
      <main>
        <${AnimatePresence} mode="wait" initial=${false} custom=${dir}>
          <motion.div key=${tab} custom=${dir} initial="enter" animate="center" exit="exit"
            variants=${{
              enter: d => ({ opacity: 0, x: d * 120 }),
              center: { opacity: 1, x: 0 },
              exit: d => ({ opacity: 0, x: d * -120 })
            }}
            transition=${{ duration: .45, ease }}>
            ${tab === 'home' && html`<${Home} data=${data} copy=${copy} />`}
            ${tab === 'about' && html`<${About} />`}
            ${tab === 'projects' && html`<${Projects} repos=${repos} onOpen=${setPending} />`}
            ${tab === 'contact' && html`<${Contact} username=${data?.discord_user?.username} copy=${copy} />`}
          </motion.div>
        <//>
      </main>
      <${AnimatePresence}>${toast && html`<motion.div key="t" className="toast" style=${{ x: '-50%' }}
        initial=${{ opacity: 0, y: 20 }} animate=${{ opacity: 1, y: 0 }} exit=${{ opacity: 0, y: 20 }} transition=${{ duration: .25, ease }}>${toast}</motion.div>`}<//>
      <${AnimatePresence}>${pending && html`<${Confirm} key="c" url=${pending} onClose=${() => setPending(null)} />`}<//>
    <//>`;
}

createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
